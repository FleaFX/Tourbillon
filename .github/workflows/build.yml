name: Build & test

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]

jobs:
    build:

        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
        - uses: actions/checkout@v7

        - name: Setup .NET
          uses: actions/setup-dotnet@v6
          with:
            dotnet-version: '10.0.x'

        - name: Restore packages
          run: dotnet restore src/Tourbillon.slnx

        - name: Build
          run: dotnet build --no-restore src/Tourbillon.slnx

        - name: Tests
          run: >
            dotnet test --no-build --solution src/Tourbillon.slnx
            --results-directory TestResults -- --report-xunit-trx

        - name: Upload test results
          if: failure()
          uses: actions/upload-artifact@v7
          with:
            name: test-results
            path: TestResults
